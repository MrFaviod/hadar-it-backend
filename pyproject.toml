[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "itsm-backend"
version = "0.1.0"
description = "ITSM backend foundation: FastAPI API, SQLAlchemy database layer and Huey task adapter."
requires-python = ">=3.14"
license = "MIT"
dependencies = [
    "fastapi==0.156.8",
    "uvicorn==0.54.0",
    "pydantic==2.14.1",
    "pydantic-settings==2.16.1",
    "SQLAlchemy==2.1.5",
    "alembic==1.20.0",
    "argon2-cffi==25.1.0",
    "babel==2.18.0",
    "cryptography==50.0.2",
    "casbin==1.43.0",
    "huey==3.4.0",
    "psycopg[binary]==3.3.6",
    "redis==8.1.0",
    "PyMySQL==1.2.3",
    "pydantic-ai-slim[openai,anthropic]==2.59.0",
    "fastmcp==4.1.3",
    "httpx==0.28.1",
    "jsonschema==4.26.0",
    "httpcore==1.0.9",
    "websockets==17.3",
    "openpyxl==3.1.5",
    "et-xmlfile==2.0.0",
    "defusedxml==0.7.1",
    "apprise==2.0.1",
    "WeasyPrint==70.0",
    "segno==1.6.6",
]

[project.optional-dependencies]
# Not installed or validated on this host: no OS ODBC driver available yet.
mssql = ["pyodbc==5.3.0"]

[project.scripts]
itsm-tasks = "itsm.tasks.cli:main"

[tool.setuptools.packages.find]
include = ["itsm*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["itsm", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["B008"]

[tool.setuptools.package-data]
"itsm.agent_integrations" = ["skills/*/*", "skills/*/*/*"]
"itsm.extensions" = [
  "sdk/schema/*.json",
  "sdk/references/*.md",
  "sdk/templates/*/*",
  "sdk/templates/*/i18n/*",
  "sdk/templates/*/skills/*/*",
  "sdk/templates/*/tests/*",
  "sdk/examples/software-licenses/*/*",
  "sdk/examples/software-licenses/*/i18n/*",
  "sdk/examples/software-licenses/*/skills/*/*",
  "sdk/examples/software-licenses/*/tests/*",
  "sdk/examples/language-pack-pt-br/*",
  "sdk/examples/language-pack-pt-br/i18n/*",
  "sdk/examples/language-pack-pt-br/i18n/docs/*/*",
  "sdk/validator/js/*",
]
"itsm.i18n" = ["catalogs/*.json"]
