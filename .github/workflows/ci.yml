name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Create virtualenv (Python 3.14)
        run: uv venv .venv --python 3.14

      - name: Install dependencies
        run: uv pip install --python .venv/bin/python -r requirements.txt -r requirements-dev.txt

      - name: Run tests
        run: .venv/bin/python -m pytest -q

      - name: Ruff lint
        run: .venv/bin/ruff check itsm tests migrations

      - name: Ruff format check
        run: .venv/bin/ruff format --check
